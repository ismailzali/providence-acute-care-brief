name: Render and Publish Quarto Dashboard

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & Jupyter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter pyyaml "pandas<3.0.0" "plotly>=5.18.0,<6.0.0" duckdb requests

      - name: Build SQLite Database Snapshot
        run: |
          python src/transform.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.4.551'

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
